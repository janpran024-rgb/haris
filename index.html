<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag Official Script -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11962597" async data-cfasync="false"></script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0d1117; color: #fff; margin: 0; padding: 15px; }
        .card { background: #161b22; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #30363d; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .avatar { width: 40px; height: 40px; background: #1f6feb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .reward-box { background: linear-gradient(135deg, #0088cc, #005588); text-align: center; border-radius: 12px; padding: 15px; }
        .stats-grid { display: flex; gap: 10px; margin: 15px 0; }
        .stat-item { flex: 1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; color: #fff; margin-top: 10px; }
        .btn-ad { background: #ffffff; color: #0088cc; }
        .btn-submit { background: #238636; }
        .btn-refer { background: #238636; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
        
        /* Clean Timer Screen Overlay */
        #timer-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.95); z-index: 99999; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; text-align: center; }
        .timer-badge { background: #1f6feb; color: white; padding: 6px 16px; border-radius: 20px; font-size: 16px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .timer-info { margin-top: auto; margin-bottom: auto; }
        .monetag-tag { font-size: 12px; color: #8b949e; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Timer Overlay Screen -->
    <div id="timer-screen">
        <div>
            <div class="timer-badge">⏳ <span id="timer-text">00:15</span></div>
        </div>

        <div class="timer-info">
            <h2 style="margin-bottom: 5px;">বিজ্ঞাপনটি দেখা হচ্ছে...</h2>
            <p style="color: #8b949e; font-size: 14px;">রিওয়ার্ড পেতে ১৫ সেকেন্ড অপেক্ষা করুন</p>
        </div>

        <div>
            <div class="monetag-tag">ads by Monetag</div>
            <button class="btn btn-ad" id="close-ad-btn" disabled onclick="completeAdProcess()">অপেক্ষা করুন...</button>
        </div>
    </div>

    <!-- User Profile -->
    <div class="card user-info">
        <div class="avatar" id="avatar">U</div>
        <div>
            <div id="user-name">User Name</div>
            <div style="color: #58a6ff;">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- Ad Section -->
    <div class="card reward-box">
        <div>প্রতি অ্যাড-এ নিশ্চিত আয়</div>
        <h1 style="margin: 8px 0;">৳ <span id="ad-reward-display">1.00</span></h1>
        
        <div class="stats-grid">
            <div class="stat-item">
                <small>আজকের অ্যাড দেখা</small>
                <div style="font-size: 18px; font-weight: bold;"><span id="ads-watched">0</span> টি</div>
            </div>
            <div class="stat-item">
                <small>আজকের মোট আয়</small>
                <div style="font-size: 18px; font-weight: bold;">৳ <span id="today-earned">0.00</span></div>
            </div>
        </div>

        <button class="btn btn-ad" id="start-ad-btn" onclick="watchAd()">▶ অ্যাড শুরু করুন (<span id="ads-remaining">10</span> টি বাকি)</button>
    </div>

    <!-- Referral Section -->
    <div class="card">
        <h3>🎁 রেফারেল বোনাস</h3>
        <p style="font-size: 14px; color: #8b949e; margin-top: 5px;">বন্ধুদের ইনভাইট করুন এবং প্রতি রেফারে বোনাস পান!</p>
        <button class="btn btn-refer" onclick="shareReferral()">🔗 রেফার লিংক শেয়ার করুন</button>
    </div>

    <!-- Withdraw Section -->
    <div class="card">
        <h3>💳 টাকা তুলুন (Withdraw)</h3>
        <select id="method">
            <option value="bkash">bKash</option>
            <option value="nagad">Nagad</option>
        </select>
        <input type="text" id="phone" placeholder="মোবাইল নম্বর">
        <input type="number" id="amount" placeholder="টাকার পরিমাণ">
        <button class="btn btn-submit" onclick="submitWithdraw()">Withdraw সাবমিট করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const BOT_USERNAME = "hiba5858"; 

        const user = tg.initDataUnsafe.user || { id: "123456", first_name: "Demo User" };

        document.getElementById('user-name').innerText = user.first_name;
        document.getElementById('avatar').innerText = user.first_name.charAt(0);

        let balance = 0;
        let adsWatched = 0;
        let todayEarned = 0;
        let adReward = 1;
        let totalAds = 10;
        let minWithdraw = 50;

        async function loadSettings() {
            try {
                const res = await fetch(`${DB_URL}/settings.json`);
                const data = await res.json();
                if(data) {
                    adReward = data.ad_reward || 1;
                    totalAds = data.total_ads || 10;
                    minWithdraw = data.min_withdraw || 50;
                }
            } catch(e) {}
            document.getElementById('ad-reward-display').innerText = adReward.toFixed(2);
            document.getElementById('amount').placeholder = `টাকার পরিমাণ (Minimum ৳${minWithdraw})`;
            updateUI();
        }

        async function loadUserData() {
            try {
                const res = await fetch(`${DB_URL}/users/${user.id}.json`);
                const data = await res.json();
                if(data) {
                    balance = data.balance || 0;
                    adsWatched = data.adsWatched || 0;
                    todayEarned = data.todayEarned || 0;
                }
            } catch(e) {}
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('ads-watched').innerText = adsWatched;
            document.getElementById('today-earned').innerText = todayEarned.toFixed(2);
            let remaining = totalAds - adsWatched;
            document.getElementById('ads-remaining').innerText = remaining > 0 ? remaining : 0;
        }

        function watchAd() {
            if (adsWatched >= totalAds) {
                alert("আজকের সব অ্যাড দেখা শেষ!");
                return;
            }

            // Trigger Monetag In-App Script if loaded
            if (typeof show_11962597 === 'function') {
                show_11962597().catch(() => {});
            }

            // Show clean Timer screen
            document.getElementById('timer-screen').style.display = 'flex';
            runTimer();
        }

        function runTimer() {
            let timeLeft = 15;
            const timerText = document.getElementById('timer-text');
            const closeBtn = document.getElementById('close-ad-btn');

            closeBtn.disabled = true;
            closeBtn.innerText = "অপেক্ষা করুন...";

            const countdown = setInterval(() => {
                timeLeft--;
                timerText.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    closeBtn.disabled = false;
                    closeBtn.innerText = "রিওয়ার্ড নিন (Continue)";
                }
            }, 1000);
        }

        function completeAdProcess() {
            document.getElementById('timer-screen').style.display = 'none';
            rewardUser();
        }

        async function rewardUser() {
            balance += adReward;
            todayEarned += adReward;
            adsWatched += 1;

            updateUI();

            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({
                    name: user.first_name,
                    balance: balance,
                    adsWatched: adsWatched,
                    todayEarned: todayEarned
                })
            });
            alert(`অভিনন্দন! আপনি ৳${adReward} পেয়েছেন।`);
        }

        function shareReferral() {
            const refLink = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
            const shareText = `আমার সাথে Task-to-Earn অ্যাপে কাজ করে টাকা আয় করুন! লিংক: ${refLink}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
        }

        async function submitWithdraw() {
            const method = document.getElementById('method').value;
            const phone = document.getElementById('phone').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if(!phone || !amount) {
                alert("সব ঘর ঠিকভাবে পূরণ করুন!");
                return;
            }
            if(amount < minWithdraw) {
                alert(`Minimum ৳${minWithdraw} withdraw করতে পারবেন!`);
                return;
            }
            if(amount > balance) {
                alert("আপনার পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            balance -= amount;
            updateUI();

            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ balance: balance })
            });

            await fetch(`${DB_URL}/withdrawals.json`, {
                method: 'POST',
                body: JSON.stringify({
                    userId: user.id,
                    name: user.first_name,
                    method: method,
                    phone: phone,
                    amount: amount,
                    status: "Pending"
                })
            });

            alert("Withdraw Request জমা হয়েছে!");
        }

        loadSettings();
        loadUserData();
    </script>
</body>
</html>
