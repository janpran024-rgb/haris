<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafi Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
            margin: 0;
        }
        .container {
            margin-top: 50px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #006699;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Hafi App</h1>
        <p>নিচের বাটনে ক্লিক করে অ্যাড দেখুন:</p>
        
        <button onclick="showAdsgramAd()">Watch Ad</button>
        
        <p id="status"></p>
    </div>

    <script>
        // Telegram WebApp Init
        window.Telegram.WebApp.ready();

        // Adsgram Controller Init (আপনার তৈরি করা Block ID সহ)
        const AdController = window.Adsgram.init({ 
            blockId: "int-52257" 
        });

        // অ্যাড দেখানোর ফাংশন
        function showAdsgramAd() {
            const statusText = document.getElementById('status');
            statusText.innerText = "অ্যাড লোড হচ্ছে...";

            AdController.show().then((result) => {
                // অ্যাড সফলভাবে সম্পন্ন হলে
                statusText.innerText = "ধন্যবাদ! অ্যাড দেখা সম্পন্ন হয়েছে।";
                console.log("Ad result:", result);
            }).catch((error) => {
                // অ্যাড না দেখা হলে বা কোনো সমস্যা হলে
                statusText.innerText = "অ্যাড সম্পূর্ণ দেখা হয়নি বা কোনো সমস্যা হয়েছে।";
                console.error("Ad error:", error);
            });
        }
    </script>
</body>
</html>
