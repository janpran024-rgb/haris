<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafi Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11962597' data-sdk='show_11962597'></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b1526; color: #fff; padding: 15px; }
        .card { background: #132238; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #1e324d; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .main-card { background: linear-gradient(135deg, #0072ff, #00c6ff); text-align: center; border: none; }
        .amount { font-size: 30px; font-weight: bold; margin: 10px 0; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn-start { background: #fff; color: #0072ff; }
        .btn-withdraw { background: #28a745; color: white; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #2b4c7e; background: #0b1526; color: white; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="card header">
        <div>
            <h4 id="user-name">Loading...</h4>
            <span id="user-balance" style="color: #4db8ff;">৳ 0.00</span>
        </div>
    </div>

    <!-- Ad Task -->
    <div class="card main-card">
        <h3>বিজ্ঞাপন দেখে আয় করুন</h3>
        <div class="amount" id="reward-text">৳ 20.00</div>
        <button class="btn btn-start" id="start-btn" onclick="handleAdClick()">▶ বিজ্ঞাপন শুরু করুন</button>
    </div>

    <!-- Withdrawal Form -->
    <div class="card">
        <h4>💳 টাকা তুলুন (Withdraw)</h4>
        <select id="method">
            <option value="bkash">বিকাশ (bKash)</option>
            <option value="nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="phone" placeholder="মোবাইল নম্বর">
        <input type="number" id="withdraw-amount" placeholder="টাকার পরিমাণ (নূন্যতম ৳১০০)">
        <button class="btn btn-withdraw" onclick="submitWithdrawal()">উইথড্র সাবমিট করুন</button>
    </div>

    <script>
        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || "test_user";
        let userName = tg.initDataUnsafe?.user?.first_name || "User";

        document.getElementById('user-name').innerText = userName;

        let userBalance = 0;
        let rewardPerAd = 20;

        // Fetch User Data from Firebase
        function loadUserData() {
            fetch(`${DB_URL}/users/${userId}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        userBalance = data.balance || 0;
                    } else {
                        // New user initialization
                        fetch(`${DB_URL}/users/${userId}.json`, {
                            method: 'PUT',
                            body: JSON.stringify({ name: userName, balance: 0 })
                        });
                    }
                    document.getElementById('user-balance').innerText = '৳ ' + userBalance.toFixed(2);
                });
        }

        loadUserData();

        function handleAdClick() {
            if (typeof show_11962597 === 'function') {
                show_11962597().then(() => rewardUser()).catch(() => rewardUser());
            } else {
                rewardUser();
            }
        }

        function rewardUser() {
            userBalance += rewardPerAd;
            document.getElementById('user-balance').innerText = '৳ ' + userBalance.toFixed(2);

            // Update Firebase
            fetch(`${DB_URL}/users/${userId}/balance.json`, {
                method: 'PUT',
                body: JSON.stringify(userBalance)
            });

            alert(`অভিনন্দন! ৳${rewardPerAd} যোগ করা হয়েছে।`);
        }

        function submitWithdrawal() {
            const method = document.getElementById('method').value;
            const phone = document.getElementById('phone').value;
            const amount = parseFloat(document.getElementById('withdraw-amount').value);

            if (!phone || isNaN(amount) || amount < 100) {
                alert('সঠিক নম্বর এবং নূন্যতম ১০০ টাকা লিখুন!');
                return;
            }

            if (amount > userBalance) {
                alert('আপনার পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            // Deduct balance and create request
            userBalance -= amount;
            fetch(`${DB_URL}/users/${userId}/balance.json`, { method: 'PUT', body: JSON.stringify(userBalance) });

            const reqData = {
                userId: userId,
                name: userName,
                method: method,
                phone: phone,
                amount: amount,
                status: "Pending"
            };

            fetch(`${DB_URL}/withdrawals.json`, {
                method: 'POST',
                body: JSON.stringify(reqData)
            }).then(() => {
                alert('উইথড্র রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!');
                loadUserData();
            });
        }
    </script>
</body>
</html>
