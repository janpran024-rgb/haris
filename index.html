<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag Official In-App Script -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11962597" async data-cfasync="false"></script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0d1117; color: #fff; margin: 0; padding: 15px; }
        .card { background: #161b22; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #30363d; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .avatar { width: 40px; height: 40px; background: #1f6feb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .reward-box { background: linear-gradient(135deg, #0088cc, #005588); text-align: center; border-radius: 12px; padding: 15px; }
        .stats-grid { display: flex; gap: 10px; margin: 15px 0; }
        .stat-item { flex: 1; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; color: #fff; margin-top: 10px; }
        .btn-ad { background: #ffffff; color: #0088cc; }
        .btn-submit { background: #238636; }
        .btn-refer { background: #238636; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
        
        /* Timer Overlay */
        #timer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .timer-circle { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #0088cc; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin-bottom: 15px; color: #fff; }
    </style>
</head>
<body>

    <!-- Timer Overlay -->
    <div id="timer-overlay">
        <div class="timer-circle" id="timer-count">15</div>
        <p style="font-size: 18px;">Ad cholche... dayapurbok apekkha korun!</p>
    </div>

    <!-- User Profile -->
    <div class="card user-info">
        <div class="avatar" id="avatar">U</div>
        <div>
            <div id="user-name">User Name</div>
            <div style="color: #58a6ff;">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- Ad Section -->
    <div class="card reward-box">
        <div>Proti ad-e nishchit ay</div>
        <h1 style="margin: 8px 0;">৳ <span id="ad-reward-display">1.00</span></h1>
        
        <div class="stats-grid">
            <div class="stat-item">
                <small>Ajker ad dekha</small>
                <div style="font-size: 18px; font-weight: bold;"><span id="ads-watched">0</span> ti</div>
            </div>
            <div class="stat-item">
                <small>Ajker ad ay</small>
                <div style="font-size: 18px; font-weight: bold;">৳ <span id="today-earned">0.00</span></div>
            </div>
        </div>

        <button class="btn btn-ad" id="ad-btn" onclick="watchAd()">▶ Ad shuru korun (<span id="ads-remaining">10</span> ti baki)</button>
    </div>

    <!-- Referral Section -->
    <div class="card">
        <h3>🎁 Referral Bonus</h3>
        <p style="font-size: 14px; color: #8b949e; margin-top: 5px;">Bondhuder invite korun ebong proti refer-e bonus pan!</p>
        <button class="btn btn-refer" onclick="shareReferral()">🔗 Refer link share korun</button>
    </div>

    <!-- Withdraw Section -->
    <div class="card">
        <h3>💳 Taka tulun (Withdraw)</h3>
        <select id="method">
            <option value="bkash">bKash</option>
            <option value="nagad">Nagad</option>
        </select>
        <input type="text" id="phone" placeholder="Mobile number">
        <input type="number" id="amount" placeholder="Takar poriman">
        <button class="btn btn-submit" onclick="submitWithdraw()">Withdraw submit korun</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const BOT_USERNAME = "hiba5858"; 

        const user = tg.initDataUnsafe.user || { id: "123456", first_name: "Demo User" };

        document.getElementById('user-name').innerText = user.first_name;
        document.getElementById('avatar').innerText = user.first_name.charAt(0);

        let balance = 0;
        let adsWatched = 0;
        let todayEarned = 0;
        let adReward = 1;
        let totalAds = 10;
        let minWithdraw = 50;

        async function loadSettings() {
            try {
                const res = await fetch(`${DB_URL}/settings.json`);
                const data = await res.json();
                if(data) {
                    adReward = data.ad_reward || 1;
                    totalAds = data.total_ads || 10;
                    minWithdraw = data.min_withdraw || 50;
                }
            } catch(e) {}
            document.getElementById('ad-reward-display').innerText = adReward.toFixed(2);
            document.getElementById('amount').placeholder = `Takar poriman (Minimum ৳${minWithdraw})`;
            updateUI();
        }

        async function loadUserData() {
            try {
                const res = await fetch(`${DB_URL}/users/${user.id}.json`);
                const data = await res.json();
                if(data) {
                    balance = data.balance || 0;
                    adsWatched = data.adsWatched || 0;
                    todayEarned = data.todayEarned || 0;
                }
            } catch(e) {}
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('ads-watched').innerText = adsWatched;
            document.getElementById('today-earned').innerText = todayEarned.toFixed(2);
            let remaining = totalAds - adsWatched;
            document.getElementById('ads-remaining').innerText = remaining > 0 ? remaining : 0;
        }

        function watchAd() {
            if (adsWatched >= totalAds) {
                alert("Ajker shob ad dekha shesh!");
                return;
            }

            // Monetag In-App Ad Triggering
            if (typeof show_11962597 === 'function') {
                show_11962597().then(() => {
                    start15SecTimer();
                }).catch(() => {
                    start15SecTimer();
                });
            } else {
                start15SecTimer();
            }
        }

        function start15SecTimer() {
            let timeLeft = 15;
            const overlay = document.getElementById('timer-overlay');
            const timerCount = document.getElementById('timer-count');
            const adBtn = document.getElementById('ad-btn');

            overlay.style.display = 'flex';
            adBtn.disabled = true;

            const countdown = setInterval(() => {
                timeLeft--;
                timerCount.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    overlay.style.display = 'none';
                    adBtn.disabled = false;
                    rewardUser();
                }
            }, 1000);
        }

        async function rewardUser() {
            balance += adReward;
            todayEarned += adReward;
            adsWatched += 1;

            updateUI();

            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({
                    name: user.first_name,
                    balance: balance,
                    adsWatched: adsWatched,
                    todayEarned: todayEarned
                })
            });
            alert(`Abhinandan! Apni ৳${adReward} peyechen.`);
        }

        function shareReferral() {
            const refLink = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
            const shareText = `Amar shathe Task-to-Earn app-e kaj kore taka ay korun! Link: ${refLink}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
        }

        async function submitWithdraw() {
            const method = document.getElementById('method').value;
            const phone = document.getElementById('phone').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if(!phone || !amount) {
                alert("Shob ghor thikbhabe puron korun!");
                return;
            }
            if(amount < minWithdraw) {
                alert(`Minimum ৳${minWithdraw} withdraw korte parben!`);
                return;
            }
            if(amount > balance) {
                alert("Apnar porjapto balance nei!");
                return;
            }

            balance -= amount;
            updateUI();

            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ balance: balance })
            });

            await fetch(`${DB_URL}/withdrawals.json`, {
                method: 'POST',
                body: JSON.stringify({
                    userId: user.id,
                    name: user.first_name,
                    method: method,
                    phone: phone,
                    amount: amount,
                    status: "Pending"
                })
            });

            alert("Withdraw request jama hoyeche!");
        }

        loadSettings();
        loadUserData();
    </script>
</body>
</html>
