<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hafi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag Telegram SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11962597' data-sdk='show_11962597'></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b1320; 
            color: #fff; 
            margin: 0; 
            padding: 15px;
            padding-bottom: 70px; /* নেভিগেশন বারের জন্য জায়গা */
        }
        
        /* Profile Header */
        .user-card { 
            background: #131c2e; 
            border-radius: 12px; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 15px; 
        }
        .avatar { 
            width: 42px; 
            height: 42px; 
            background: #2b5278; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: bold; 
        }
        .user-details .name { font-weight: bold; font-size: 15px; }
        .user-details .balance { color: #2abee8; font-size: 13px; margin-top: 2px; }

        /* Main Reward Box */
        .reward-card { 
            background: linear-gradient(135deg, #0088cc, #00aaff); 
            border-radius: 16px; 
            padding: 20px 15px; 
            text-align: center; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .reward-title { font-size: 13px; opacity: 0.9; }
        .reward-amount { font-size: 32px; font-weight: bold; margin: 8px 0; }
        
        .stats-row { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0 20px 0; 
        }
        .stat-box { 
            flex: 1; 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 8px; 
            padding: 10px 5px; 
        }
        .stat-label { font-size: 11px; opacity: 0.8; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }

        .btn-start { 
            width: 100%; 
            padding: 14px; 
            background: #ffffff; 
            color: #0088cc; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box;
            transition: 0.2s;
        }
        .btn-start:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        /* Refer Card */
        .refer-card { 
            background: #131c2e; 
            border-radius: 16px; 
            padding: 18px 15px; 
            margin-bottom: 15px; 
        }
        .refer-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .refer-subtitle { font-size: 12px; color: #8a99ad; margin: 6px 0 15px 0; }
        .btn-refer { 
            width: 100%; 
            padding: 12px; 
            background: #00a859; 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #131c2e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1f293d;
            box-sizing: border-box;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: #8a99ad;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #00aaff;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- User Profile Header -->
    <div class="user-card">
        <div class="avatar" id="avatar">A</div>
        <div class="user-details">
            <div class="name" id="user-name">Loading...</div>
            <div class="balance">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- Main Ad Task Section -->
    <div class="reward-card">
        <div class="reward-title">প্রতি বিজ্ঞাপনে নিশ্চিত আয়</div>
        <div class="reward-amount">৳ <span id="ad-reward-display">20.00</span></div>
        
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">আজকের বিজ্ঞাপন দেখা</div>
                <div class="stat-value"><span id="ads-watched">0</span> টি</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">আজকের বিজ্ঞাপন আয়</div>
                <div class="stat-value">৳ <span id="today-earned">0.00</span></div>
            </div>
        </div>

        <button class="btn-start" id="ad-btn" onclick="watchAd()">▶ বিজ্ঞাপন শুরু করুন (<span id="ads-remaining">50</span> টি বাকি)</button>
    </div>

    <!-- Referral Section -->
    <div class="refer-card">
        <div class="refer-title">🎁 রেফারেল বোনাস</div>
        <div class="refer-subtitle">বন্ধুদের ইনভাইট করুন এবং প্রতি রেফারে ৳১০০ পান!</div>
        <button class="btn-refer" onclick="shareReferral()">🔗 রেফার লিংক শেয়ার করুন</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item active">
            <div>🏠</div>হোম
        </button>
        <button class="nav-item" onclick="alert('আয় করার জন্য উপরের বিজ্ঞাপন শুরু করুন বাটনে ক্লিক করুন।')">
            <div>💰</div>আয় করুন
        </button>
        <button class="nav-item" onclick="alert('সাপোর্টের জন্য আমাদের টেলিগ্রাম চ্যানেলে যোগাযোগ করুন।')">
            <div>❓</div>সাপোর্ট
        </button>
        <button class="nav-item" onclick="alert('উইথড্র অপশন শীঘ্রই আসছে!')">
            <div>💳</div>উইথড্র
        </button>
        <button class="nav-item" onclick="alert('প্রফাইল ফিচারটি আপডেট করা হচ্ছে।')">
            <div>👤</div>প্রফাইল
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const BOT_USERNAME = "hiba5858"; 

        const user = tg.initDataUnsafe.user || { id: "123456", first_name: "ABU SALEH MD HARIS" };

        document.getElementById('user-name').innerText = user.first_name.toUpperCase();
        document.getElementById('avatar').innerText = user.first_name.charAt(0).toUpperCase();

        let balance = 0;
        let adsWatched = 0;
        let todayEarned = 0;
        let adReward = 20;
        let totalAds = 50;

        async function loadUserData() {
            try {
                // আজকের তারিখ বের করা (ডেইলি রিসেটের জন্য)
                const currentDate = new Date().toISOString().split('T')[0];

                // Fetch User Data
                const res = await fetch(`${DB_URL}/users/${user.id}.json`);
                const data = await res.json();
                
                if(data) {
                    let lastReset = data.lastResetDate || "";
                    
                    // যদি দিন পরিবর্তন হয়ে থাকে তবে আজকের অ্যাড কাউন্ট রিসেট হবে
                    if (lastReset !== currentDate) {
                        adsWatched = 0;
                        todayEarned = 0;
                        await fetch(`${DB_URL}/users/${user.id}.json`, {
                            method: 'PATCH',
                            body: JSON.stringify({
                                adsWatched: 0,
                                todayEarned: 0,
                                lastResetDate: currentDate
                            })
                        });
                    } else {
                        adsWatched = data.adsWatched || 0;
                        todayEarned = data.todayEarned || 0;
                    }
                    balance = data.balance || 0;
                } else {
                    // নতুন ইউজার হলে ইনিশিয়াল ডাটা সেভ করা
                    await fetch(`${DB_URL}/users/${user.id}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            name: user.first_name,
                            balance: 0,
                            adsWatched: 0,
                            todayEarned: 0,
                            lastResetDate: currentDate
                        })
                    });
                }

                // Fetch Dynamic Settings from Firebase
                const settingsRes = await fetch(`${DB_URL}/settings.json`);
                const settingsData = await settingsRes.json();
                if(settingsData) {
                    if(settingsData.adReward !== undefined) adReward = Number(settingsData.adReward);
                    else if(settingsData.ad_reward !== undefined) adReward = Number(settingsData.ad_reward);

                    if(settingsData.totalAds !== undefined) totalAds = Number(settingsData.totalAds);
                    else if(settingsData.ads !== undefined) totalAds = Number(settingsData.ads);
                    else if(settingsData.total_ads !== undefined) totalAds = Number(settingsData.total_ads);
                }
            } catch(e) {
                console.log("Error loading data", e);
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('ads-watched').innerText = adsWatched;
            document.getElementById('today-earned').innerText = todayEarned.toFixed(2);
            document.getElementById('ad-reward-display').innerText = adReward.toFixed(2);
            
            let remaining = totalAds - adsWatched;
            document.getElementById('ads-remaining').innerText = remaining > 0 ? remaining : 0;

            if (adsWatched >= totalAds) {
                const btn = document.getElementById('ad-btn');
                btn.innerText = "আজকের বিজ্ঞাপন দেখা শেষ!";
                btn.disabled = true;
            }
        }

        // Monetag Telegram SDK Ad Function
        async function watchAd() {
            if (adsWatched >= totalAds) {
                alert("আজকের সব বিজ্ঞাপন দেখা শেষ!");
                return;
            }

            const btn = document.getElementById('ad-btn');
            btn.disabled = true;
            btn.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            if (typeof show_11962597 === 'function') {
                show_11962597().then(async () => {
                    await giveRewardAndSync("MonetagSDK");
                    btn.disabled = false;
                }).catch(async (err) => {
                    console.log("Monetag SDK error/closed", err);
                    btn.disabled = false;
                    updateUI();
                    alert("এই মুহূর্তে কোনো বিজ্ঞাপন উপলব্ধ নেই অথবা কেটে দেওয়া হয়েছে!");
                });
            } else {
                btn.disabled = false;
                updateUI();
                alert("বিজ্ঞাপন লোড হতে সমস্যা হচ্ছে। একটু পরে আবার চেষ্টা করুন!");
            }
        }

        async function giveRewardAndSync(sourceType) {
            balance += adReward;
            todayEarned += adReward;
            adsWatched += 1;

            updateUI();

            const currentDate = new Date().toISOString().split('T')[0];
            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({
                    name: user.first_name,
                    balance: balance,
                    adsWatched: adsWatched,
                    todayEarned: todayEarned,
                    lastResetDate: currentDate,
                    lastAdSource: sourceType
                })
            });
        }

        function shareReferral() {
            const refLink = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
            const shareText = `আমার সাথে Task-to-Earn অ্যাপে কাজ করে টাকা আয় করুন! লিংক: ${refLink}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
        }

        loadUserData();
    </script>
</body>
</html>
