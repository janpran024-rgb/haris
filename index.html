<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-to-Earn Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b141a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .container {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }
        .card {
            background: linear-gradient(135deg, #0088cc, #005580);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .profile-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            background: #ffffff;
            color: #0088cc;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 12px;
        }
        .user-info h3 {
            margin: 0;
            font-size: 16px;
        }
        .user-info p {
            margin: 3px 0 0;
            font-size: 14px;
            color: #d1d5db;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 8px;
            width: 48%;
            text-align: center;
        }
        .stat-box p {
            margin: 0;
            font-size: 12px;
            color: #e2e8f0;
        }
        .stat-box h4 {
            margin: 5px 0 0;
            font-size: 16px;
        }
        .action-btn {
            background: #ffffff;
            color: #0088cc;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        .ref-card {
            background: #111b21;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .ref-btn {
            background: #22c55e;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .nav-bar {
            display: flex;
            background: #111b21;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            flex: 1;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <div class="profile-box">
            <div class="avatar" id="avatar">A</div>
            <div class="user-info">
                <h3 id="user-name">Loading...</h3>
                <p id="user-balance">৳0.00</p>
            </div>
        </div>

        <!-- Main Task Card -->
        <div class="card">
            <div style="text-align: center; margin-bottom: 12px;">
                <p style="margin: 0; font-size: 13px; color: #e2e8f0;">Proti biggapone nischito ay</p>
                <h2 style="margin: 5px 0 0; font-size: 26px;" id="reward-display">৳2.00</h2>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">
                    <p>Ajker biggapon dewa</p>
                    <h4 id="watched-display">0 ti</h4>
                </div>
                <div class="stat-box">
                    <p>Ajker biggapon ay</p>
                    <h4 id="today-earn-display">৳0.00</h4>
                </div>
            </div>

            <button class="action-btn" id="watch-btn" onclick="startTask()">⏳ Loading...</button>
        </div>

        <!-- Referral Card -->
        <div class="ref-card">
            <p style="margin: 0; font-size: 14px; font-weight: bold;">🎁 Referal Bonus</p>
            <p style="margin: 5px 0; font-size: 12px; color: #9ca3af;">Bondhuder invite korun ebong proti refare ৳100 pan!</p>
            <button class="ref-btn" onclick="shareReferral()">🔗 Refar link shear korun</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="#" class="nav-item active">🏠<br>Hom</a>
        <a href="#" class="nav-item">💰<br>Ay korun</a>
        <a href="#" class="nav-item">❓<br>Saport</a>
        <a href="#" class="nav-item">💳<br>Uithdrw</a>
        <a href="#" class="nav-item">👤<br>Profil</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const BOT_USERNAME = "Jh58bot";

        const user = tg.initDataUnsafe.user || { id: "123456", first_name: "Test User" };
        const userId = user.id.toString();
        const userName = user.first_name || "User";

        document.getElementById('user-name').innerText = userName;
        document.getElementById('avatar').innerText = userName.charAt(0).toUpperCase();

        let balance = 0;
        let adsWatched = 0;
        let todayEarned = 0;
        let adReward = 2;
        let totalAds = 50;

        async function loadAppData() {
            try {
                // Settings load
                const settingsRes = await fetch(`${DB_URL}/settings.json`);
                const settings = await settingsRes.json();
                if (settings) {
                    adReward = settings.ad_reward || 2;
                    totalAds = settings.total_ads || 50;
                    document.getElementById('reward-display').innerText = `৳${adReward.toFixed(2)}`;
                }

                // User data load
                const userRes = await fetch(`${DB_URL}/users/${userId}.json`);
                const userData = await userRes.json();

                const today = new Date().toISOString().split('T')[0];

                if (userData) {
                    balance = userData.balance || 0;
                    if (userData.last_reset_date === today) {
                        adsWatched = userData.today_watched_ads || 0;
                    } else {
                        adsWatched = 0;
                        await fetch(`${DB_URL}/users/${userId}.json`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ today_watched_ads: 0, last_reset_date: today })
                        });
                    }
                } else {
                    // New user create
                    balance = 0;
                    adsWatched = 0;
                    await fetch(`${DB_URL}/users/${userId}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: userName, balance: 0, today_watched_ads: 0, last_reset_date: today })
                    });
                }

                todayEarned = adsWatched * adReward;
                updateUI();
            } catch (error) {
                console.error("Data load error:", error);
                document.getElementById('watch-btn').innerText = "▶️ Biggapon shuru korun";
            }
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = `৳${balance.toFixed(2)}`;
            document.getElementById('watched-display').innerText = `${adsWatched} ti`;
            document.getElementById('today-earn-display').innerText = `৳${todayEarned.toFixed(2)}`;

            const remaining = totalAds - adsWatched;
            const btn = document.getElementById('watch-btn');
            if (remaining > 0) {
                btn.innerText = `▶️ Biggapon shuru korun (${remaining} ti baki)`;
                btn.disabled = false;
            } else {
                btn.innerText = `❌ Ajker sob biggapon dewa ses`;
                btn.disabled = true;
            }
        }

        async function startTask() {
            if (adsWatched >= totalAds) return;

            const btn = document.getElementById('watch-btn');
            btn.innerText = "⏳ Biggapon load hocche...";
            btn.disabled = true;

            setTimeout(async () => {
                adsWatched += 1;
                balance += adReward;
                todayEarned = adsWatched * adReward;

                const today = new Date().toISOString().split('T')[0];
                try {
                    await fetch(`${DB_URL}/users/${userId}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            balance: balance,
                            today_watched_ads: adsWatched,
                            last_reset_date: today,
                            name: userName
                        })
                    });
                } catch (e) {
                    console.error("Update error", e);
                }

                updateUI();
            }, 2000);
        }

        function shareReferral() {
            const refLink = `https://t.me/${BOT_USERNAME}?start=${userId}`;
            const text = `Amar sathe Task-to-Earn app-e kaj kore taka ay korun!\nLink: ${refLink}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(text)}`;
            window.open(shareUrl, '_blank');
        }

        loadAppData();
    </script>
</body>
</html>
