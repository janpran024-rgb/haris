<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hafi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b1320; 
            color: #fff; 
            margin: 0; 
            padding: 15px; 
        }
        
        /* Profile Header */
        .user-card { 
            background: #131c2e; 
            border-radius: 12px; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 15px; 
        }
        .avatar { 
            width: 42px; 
            height: 42px; 
            background: #2b5278; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: bold; 
        }
        .user-details .name { font-weight: bold; font-size: 15px; }
        .user-details .balance { color: #2abee8; font-size: 13px; margin-top: 2px; }

        /* Main Reward Box */
        .reward-card { 
            background: linear-gradient(135deg, #0088cc, #00aaff); 
            border-radius: 16px; 
            padding: 20px 15px; 
            text-align: center; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .reward-title { font-size: 13px; opacity: 0.9; }
        .reward-amount { font-size: 32px; font-weight: bold; margin: 8px 0; }
        
        .stats-row { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0 20px 0; 
        }
        .stat-box { 
            flex: 1; 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 8px; 
            padding: 10px 5px; 
        }
        .stat-label { font-size: 11px; opacity: 0.8; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }

        .btn-start { 
            width: 100%; 
            padding: 14px; 
            background: #ffffff; 
            color: #0088cc; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-sizing: border-box;
        }

        /* Refer Card */
        .refer-card { 
            background: #131c2e; 
            border-radius: 16px; 
            padding: 18px 15px; 
            margin-bottom: 15px; 
        }
        .refer-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .refer-subtitle { font-size: 12px; color: #8a99ad; margin: 6px 0 15px 0; }
        .btn-refer { 
            width: 100%; 
            padding: 12px; 
            background: #00a859; 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <!-- User Profile Header -->
    <div class="user-card">
        <div class="avatar" id="avatar">A</div>
        <div class="user-details">
            <div class="name" id="user-name">Loading...</div>
            <div class="balance">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- Main Ad Task Section -->
    <div class="reward-card">
        <div class="reward-title">প্রতি বিজ্ঞাপনে নিশ্চিত আয়</div>
        <div class="reward-amount">৳ <span id="ad-reward-display">20.00</span></div>
        
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">আজকের বিজ্ঞাপন দেখা</div>
                <div class="stat-value"><span id="ads-watched">0</span> টি</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">আজকের বিজ্ঞাপন আয়</div>
                <div class="stat-value">৳ <span id="today-earned">0.00</span></div>
            </div>
        </div>

        <button class="btn-start" onclick="watchAd()">▶ বিজ্ঞাপন শুরু করুন (<span id="ads-remaining">50</span> টি বাকি)</button>
    </div>

    <!-- Referral Section -->
    <div class="refer-card">
        <div class="refer-title">🎁 রেফারেল বোনাস</div>
        <div class="refer-subtitle">বন্ধুদের ইনভাইট করুন এবং প্রতি রেফারে ৳১০০ পান!</div>
        <button class="btn-refer" onclick="shareReferral()">🔗 রেফার লিংক শেয়ার করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const DB_URL = "https://hafi-hiba-default-rtdb.firebaseio.com/";
        const BOT_USERNAME = "hiba5858"; 
        
        // Monetag Direct Ad Link (Backup)
        const MONETAG_DIRECT_LINK = "https://omg10.com/4/11964704"; 

        // Adsgram Controller Init
        const AdController = window.Adsgram.init({ 
            blockId: "int-52257" 
        });

        const user = tg.initDataUnsafe.user || { id: "123456", first_name: "ABU SALEH MD HARIS" };

        document.getElementById('user-name').innerText = user.first_name.toUpperCase();
        document.getElementById('avatar').innerText = user.first_name.charAt(0).toUpperCase();

        let balance = 0;
        let adsWatched = 0;
        let todayEarned = 0;
        let adReward = 20;
        let totalAds = 50;

        async function loadUserData() {
            try {
                const res = await fetch(`${DB_URL}/users/${user.id}.json`);
                const data = await res.json();
                if(data) {
                    balance = data.balance || 0;
                    adsWatched = data.adsWatched || 0;
                    todayEarned = data.todayEarned || 0;
                }
            } catch(e) {}
            updateUI();
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('ads-watched').innerText = adsWatched;
            document.getElementById('today-earned').innerText = todayEarned.toFixed(2);
            document.getElementById('ad-reward-display').innerText = adReward.toFixed(2);
            let remaining = totalAds - adsWatched;
            document.getElementById('ads-remaining').innerText = remaining > 0 ? remaining : 0;
        }

        // Smart Hybrid Ad Function (Adsgram first, Monetag as fallback)
        async function watchAd() {
            if (adsWatched >= totalAds) {
                alert("আজকের সব বিজ্ঞাপন দেখা শেষ!");
                return;
            }

            // Try Adsgram Video Ad first
            AdController.show().then(async (result) => {
                // Adsgram Successful
                await giveRewardAndSync("Adsgram");
            }).catch(async (error) => {
                // If Adsgram has no ads, automatically fallback to Monetag Direct Link!
                console.log("Adsgram fallback to Monetag due to:", error);
                tg.openLink(MONETAG_DIRECT_LINK);
                await giveRewardAndSync("Monetag");
            });
        }

        async function giveRewardAndSync(sourceType) {
            balance += adReward;
            todayEarned += adReward;
            adsWatched += 1;

            updateUI();

            await fetch(`${DB_URL}/users/${user.id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({
                    name: user.first_name,
                    balance: balance,
                    adsWatched: adsWatched,
                    todayEarned: todayEarned,
                    lastAdSource: sourceType
                })
            });
        }

        function shareReferral() {
            const refLink = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
            const shareText = `আমার সাথে Task-to-Earn অ্যাপে কাজ করে টাকা আয় করুন! লিংক: ${refLink}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`);
        }

        loadUserData();
    </script>
</body>
</html>
